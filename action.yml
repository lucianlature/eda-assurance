name: EDA Assurance
description: Fail the PR when an event-schema change is incompatible with deployed consumers.
author: Lucian Lature
branding:
  icon: shield
  color: red
inputs:
  root:
    description: Repo path to preflight, relative to the workspace (or absolute).
    required: false
    default: "."
  fail-on:
    description: review = fail the job on REVIEW findings (e.g. breaking field removal). never = annotations only.
    required: false
    default: review
  base:
    description: Git ref whose consumers count as still running during the rollout. Defaults to the PR base; empty on push events (head-only).
    required: false
    default: ${{ github.event.pull_request.base.sha }}
outputs:
  state:
    description: Worst preflight state (PASS or REVIEW).
    value: ${{ steps.preflight.outputs.state }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: "22"
    - name: Install
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --omit=dev
    - name: Preflight
      id: preflight
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        EDA_ROOT: ${{ inputs.root }}
        EDA_FAIL_ON: ${{ inputs.fail-on }}
        EDA_BASE: ${{ inputs.base }}
        NODE_OPTIONS: --experimental-strip-types --disable-warning=ExperimentalWarning
        WORKSPACE: ${{ github.workspace }}
      run: |
        set -euo pipefail
        ROOT="$EDA_ROOT"
        if [[ "$ROOT" != /* ]]; then
          ROOT="$WORKSPACE/$ROOT"
        fi
        BASE_ARGS=()
        if [[ -n "$EDA_BASE" ]]; then
          if ! git -C "$ROOT" cat-file -e "$EDA_BASE^{commit}" 2>/dev/null; then
            git -C "$ROOT" fetch --quiet --no-tags --depth=1 origin "$EDA_BASE" \
              || echo "::warning title=eda-assurance::could not fetch base $EDA_BASE; head-only preflight"
          fi
          BASE_ARGS=(--base "$EDA_BASE")
        fi
        node "$ACTION_PATH/src/cli.ts" preflight "$ROOT" --fail-on "$EDA_FAIL_ON" ${BASE_ARGS[@]+"${BASE_ARGS[@]}"}
